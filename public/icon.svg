<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Khana Plan: a thali">
  <defs>
    <!-- same deep warm dark as the app, with a faint turmeric glow behind the plate -->
    <radialGradient id="bg" cx="50%" cy="46%" r="70%"><stop offset="0" stop-color="#34261a"/><stop offset="1" stop-color="#17110a"/></radialGradient>
    <g id="katori">
      <circle r="39" fill="#bcc4cd"/>
      <circle r="39" fill="none" stroke="#98a3af" stroke-width="3"/>
      <circle r="29" fill="currentColor"/>
      <ellipse cx="-9" cy="-11" rx="11" ry="5" fill="#fff" opacity=".4" transform="rotate(-30 -9 -11)"/>
    </g>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <!-- plate grows a little vs. before (no coloured field to fill), still inside the 80% maskable safe zone -->
  <g transform="translate(256 256) scale(1.04) translate(-256 -256)">
    <ellipse cx="256" cy="268" rx="176" ry="170" fill="#000" opacity=".4"/>
    <circle cx="256" cy="256" r="172" fill="#f5f0e7"/>
    <circle cx="256" cy="256" r="172" fill="none" stroke="#d6ccba" stroke-width="6"/>
    <circle cx="256" cy="256" r="150" fill="none" stroke="#e5dccb" stroke-width="3"/>
    <use href="#katori" x="187" y="187" color="#f1b53c"/>
    <use href="#katori" x="325" y="187" color="#5f9142"/>
    <use href="#katori" x="187" y="325" color="#c8472b"/>
    <use href="#katori" x="325" y="325" color="#fffaf0"/>
    <circle cx="256" cy="256" r="51" fill="#fffdf8" stroke="#e1d9c8" stroke-width="3"/>
    <g fill="#ece4d3">
      <ellipse cx="238" cy="244" rx="9" ry="4" transform="rotate(-25 238 244)"/><ellipse cx="262" cy="240" rx="9" ry="4" transform="rotate(15 262 240)"/>
      <ellipse cx="274" cy="262" rx="9" ry="4" transform="rotate(-10 274 262)"/><ellipse cx="248" cy="268" rx="9" ry="4" transform="rotate(30 248 268)"/>
      <ellipse cx="232" cy="262" rx="9" ry="4" transform="rotate(-5 232 262)"/><ellipse cx="258" cy="280" rx="9" ry="4" transform="rotate(20 258 280)"/>
    </g>
    <circle cx="262" cy="250" r="6" fill="#5f9142"/>
  </g>
</svg>
