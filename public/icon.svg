<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Khana Plan: a steaming bowl of curry and rice">
  <!-- transparent background on purpose; the dark outline keeps it readable on light and dark surfaces -->
  <g transform="translate(0 -14)" stroke-linejoin="round" stroke-linecap="round">
    <!-- steam: dark under-stroke + turmeric top stroke, so it shows on any background -->
    <g fill="none">
      <path d="M204 198C184 170 224 152 204 120C194 104 202 92 210 86" stroke="#2b1d12" stroke-width="30"/>
      <path d="M256 188C236 160 276 142 256 110C246 94 254 82 262 76" stroke="#2b1d12" stroke-width="30"/>
      <path d="M308 198C288 170 328 152 308 120C298 104 306 92 314 86" stroke="#2b1d12" stroke-width="30"/>
      <path d="M204 198C184 170 224 152 204 120C194 104 202 92 210 86" stroke="#f3b94f" stroke-width="15"/>
      <path d="M256 188C236 160 276 142 256 110C246 94 254 82 262 76" stroke="#f3b94f" stroke-width="15"/>
      <path d="M308 198C288 170 328 152 308 120C298 104 306 92 314 86" stroke="#f3b94f" stroke-width="15"/>
    </g>
    <!-- foot -->
    <path d="M190 438H322L314 466C312 472 306 474 300 474H212C206 474 200 472 198 466Z" fill="#8f2f1b" stroke="#2b1d12" stroke-width="12"/>
    <!-- bowl body -->
    <path d="M88 264C88 374 164 442 256 442C348 442 424 374 424 264Z" fill="#c8472b" stroke="#2b1d12" stroke-width="12"/>
    <path d="M110 318Q256 392 402 318" fill="none" stroke="#f3b94f" stroke-width="10"/>
    <path d="M118 304C126 354 158 394 204 414" fill="none" stroke="#e8704d" stroke-width="14" opacity=".7"/>
    <!-- rim, curry, rice -->
    <ellipse cx="256" cy="264" rx="168" ry="40" fill="#e25b3a" stroke="#2b1d12" stroke-width="12"/>
    <ellipse cx="256" cy="266" rx="146" ry="29" fill="#f0a53a"/>
    <path d="M160 268C160 198 304 198 304 268C304 288 160 288 160 268Z" fill="#fffaf0" stroke="#2b1d12" stroke-width="10"/>
    <g fill="#e6d9bf">
      <ellipse cx="200" cy="240" rx="9" ry="4" transform="rotate(-25 200 240)"/><ellipse cx="228" cy="226" rx="9" ry="4" transform="rotate(15 228 226)"/>
      <ellipse cx="258" cy="244" rx="9" ry="4" transform="rotate(-10 258 244)"/><ellipse cx="214" cy="262" rx="9" ry="4" transform="rotate(30 214 262)"/>
      <ellipse cx="248" cy="264" rx="9" ry="4" transform="rotate(-5 248 264)"/><ellipse cx="280" cy="256" rx="9" ry="4" transform="rotate(20 280 256)"/>
    </g>
    <!-- coriander leaves on the curry -->
    <g fill="#5f9142" stroke="#2b1d12" stroke-width="6">
      <ellipse cx="342" cy="262" rx="15" ry="8" transform="rotate(-30 342 262)"/><ellipse cx="318" cy="280" rx="14" ry="7" transform="rotate(20 318 280)"/><ellipse cx="364" cy="276" rx="13" ry="7" transform="rotate(35 364 276)"/>
    </g>
  </g>
</svg>
